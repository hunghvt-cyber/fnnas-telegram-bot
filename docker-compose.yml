services:
  telegrambot:
    container_name: telegrambot

    build: .

    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID}
      STATUS_FILE: /app/data/status.env
      LOG_FILE: /app/logs/bot.log

    volumes:
      - /vol1/Docker/TelegramBot/data:/app/data
      - /vol1/Docker/TelegramBot/logs:/app/logs

    working_dir: /app

    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
